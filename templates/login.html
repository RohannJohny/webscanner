<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portscan // login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e0d;
    --panel: #0f1513;
    --panel-2: #121a17;
    --border: #1e2b26;
    --text: #d7f2df;
    --text-dim: #6d8078;
    --accent: #39ff88;
    --accent-dim: #1f8f52;
    --red: #ff5c5c;
    --font-display: 'Space Mono', monospace;
    --font-body: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(circle at 50% 30%, rgba(57,255,136,0.06), transparent 45%);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px;
    margin: 20px;
  }
  .eyebrow {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent-dim);
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    margin: 6px 0 24px;
  }
  h1 .cursor {
    display: inline-block;
    width: 11px; height: 20px;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: -3px;
    animation: blink 1.1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    outline: none;
    margin-bottom: 16px;
  }
  input:focus { border-color: var(--accent-dim); }
  button {
    width: 100%;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 11px 22px;
    border-radius: 4px;
    border: none;
    background: var(--accent);
    color: #06120a;
    cursor: pointer;
  }
  button:hover { opacity: 0.88; }
  .error {
    background: rgba(255,92,92,0.1);
    border: 1px solid rgba(255,92,92,0.3);
    color: var(--red);
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 4px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">tcp connect scanner</div>
    <h1>login<span class="cursor"></span></h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
